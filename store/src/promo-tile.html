<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="store.css">
  <style>
    body { width: 440px; height: 280px; display: grid; place-items: center; background: linear-gradient(135deg, #7bc42a, #2e8b3a); color: #fff; }
    .tile { text-align: center; }
    .tile img { width: 88px; height: 88px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.2)); }
    .tile h2 { margin: 14px 0 6px; font-size: 32px; letter-spacing: -0.01em; }
    .tile p { margin: 0; font-size: 18px; opacity: 0.92; }
  </style>
</head>
<body>
  <div class="tile">
    <img src="../../images/logo-128.png" alt="">
    <h2>Kleinanzeigen Pusher</h2>
    <p>Alte Anzeigen wieder ganz nach oben</p>
  </div>
</body>
</html>
